name: Cabinet regression tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Select a real Chromium browser
        shell: bash
        run: |
          # Hosted runners usually include Chrome and its native dependencies.
          # Avoid an unnecessary browser/apt download; retain the Playwright
          # installation path for runners that do not have Chrome installed.
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright-core install --with-deps chromium
          fi
      - run: npm run test:browser
