name: Deploy to GitHub Pages

# The site is published by Actions (Pages here is configured with
# build_type: workflow). Every merge to main is a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the source, write to Pages, mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always let the newer one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp .nojekyll _site/ 2>/dev/null || true
          # Optional metadata for non-Actions/static hosting. For this Actions
          # deploy, the custom domain must be set in Settings > Pages;
          # GitHub ignores CNAME files inside uploaded Pages artifacts.
          cp CNAME _site/ 2>/dev/null || true
          cp -r assets _site/
          echo "--- publishing:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
